[package]
name = "arrman"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
description = "Compose-aware operations console for self-hosted media services"
license = "MIT"
repository = "https://github.com/kevinelliott/arrman"
homepage = "https://github.com/kevinelliott/arrman"
readme = "README.md"
keywords = ["docker", "compose", "media-server", "tui", "self-hosted"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "docker_services"

[[bin]]
name = "arrman"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "multipart", "tokio", "http1"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
flate2 = "1.1"
fs2 = "0.4"
futures-util = "0.3"
rand = "0.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tar = "0.4"
tempfile = "3.15"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "request-id", "trace"] }
unicode-width = "0.2"
ureq = { version = "2.12", default-features = false, features = ["gzip", "json", "tls"] }
url = "2.5"
walkdir = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
