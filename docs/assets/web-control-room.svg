<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Arrman web control room</title>
  <desc id="desc">Deterministic desktop demo of the Arrman web interface with host metrics, fleet state, a selected Jellyfin workbench, dependency interlocks, and a live activity channel.</desc>
